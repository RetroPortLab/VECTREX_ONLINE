# Render Blueprint: New -> Blueprint, point it at this repo, and it creates the service.
services:
  - type: web
    name: vectrex-netlink
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      # Neon connection string (see README): accounts and scores live there. Without it they are in memory.
      - key: DATABASE_URL
        sync: false
